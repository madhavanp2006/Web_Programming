# Server Port
server.port=8081

# Spring Data Source MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/foodhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configurations
# A 256-bit secret key encoded in hex or base64
foodhub.jwt.secret=9a4f2c8d3b7a1e5f8g2h6k9l0m3n6p8q1r4s7t0u3v6w9y2z5A8B0C3D6E9F2G5H8
# Expiration: 1 day in milliseconds (86400000)
foodhub.jwt.expiration=86400000

# File Upload configurations
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
